<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if shop %}{{ shop.name }} — Join the queue{% else %}Shop not found{% endif %}</title>
    <meta name="theme-color" content="#9333ea">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-code="{{ code }}" data-shop='{{ shop | tojson if shop else "null" }}'>
    <div id="app"></div>
    <div id="toasts" class="toast-stack"></div>
    <script src="{{ url_for('static', filename='join.js') }}"></script>
</body>
</html>
